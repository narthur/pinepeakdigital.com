version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      npm-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      npm-major:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["major"]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
